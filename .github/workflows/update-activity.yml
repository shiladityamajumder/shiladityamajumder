name: Refresh engineering profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-lab-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'shiladityamajumder/shiladityamajumder'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate all profile artwork
        run: python scripts/generate_assets.py
      - name: Refresh public repository snapshot and links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_activity.py
      - name: Validate profile assets
        run: python scripts/validate_profile.py
      - name: Check activity failure handling
        run: python -m unittest discover -s tests -v
      - name: Commit generated profile files when changed
        run: |
          if [ -n "$(git status --porcelain -- assets/ README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/ README.md
            git commit -m "chore: refresh engineering profile"
            git push origin HEAD:main
          fi
