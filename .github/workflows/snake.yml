name: Generate blue contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Tech Blue contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2563EB&color_dots=#EFF6FF,#DBEAFE,#93C5FD,#3B82F6,#1D4ED8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#0F172A,#172554,#1E3A8A,#2563EB,#60A5FA

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
