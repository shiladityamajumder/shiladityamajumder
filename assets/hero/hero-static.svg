<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Shiladitya Majumder — Systems in Motion — static edition</title>
<desc id="desc">Backend software engineer. Building reliable systems. Designing for scale. Engineering for the real world. Illustrative client to gateway to FastAPI architecture, with PostgreSQL and Redis interactions, RabbitMQ delivery to Celery workers, and a returning response. Static edition without animation.</desc>
