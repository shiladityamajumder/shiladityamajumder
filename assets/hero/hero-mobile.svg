<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Shiladitya Majumder — Systems in Motion</title>
<desc id="desc">Backend software engineer. Building reliable systems. Designing for scale. Engineering for the real world. Illustrative client to gateway to FastAPI architecture, with PostgreSQL and Redis interactions, RabbitMQ delivery to Celery workers, and a returning response. A calm fourteen-second animation follows one request cycle.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#25344A" stroke-opacity=".26" stroke-width=".7"/></pattern><radialGradient id="light"><stop stop-color="#3B82F6" stop-opacity=".15"/><stop offset="1" stop-color="#080D18" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#60A5FA" stroke-width="1.3" fill="none"/></marker></defs>
<style>
        @keyframes process { 0%,19%,27%,100% {opacity:.25} 23% {opacity:1} }
        @keyframes background { 0%,74%,91%,100% {opacity:.25} 82% {opacity:1} }
        @keyframes cursor { 0%,45% {opacity:1} 55%,100% {opacity:0} }
        .process {animation:process 14s ease-in-out infinite}
        .process-worker {animation:background 14s ease-in-out infinite}
        .cursor {animation:cursor 1.8s step-end infinite}
        @media (prefers-reduced-motion:reduce) {
          .motion {display:none} .process,.process-worker,.cursor {animation:none}
        }
        </style>
