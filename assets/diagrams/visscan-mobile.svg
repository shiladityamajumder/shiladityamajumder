<svg xmlns="http://www.w3.org/2000/svg" width="480" height="432" viewBox="0 0 480 432" fill="none" role="img" aria-labelledby="title desc">
<title id="title">01 / DOCUMENT INTELLIGENCE</title>
<desc id="desc">Simplified source-informed flow: Document (PDF / DOCX / image) → Extract (text / OCR) → OpenAI (structured JSON) → MiniLM (resume + job data) → Match (score + highlights). VERIFIED FLOW / JOB DESCRIPTION IS PARSED SEPARATELY. Represents implemented code paths, not a production or security audit.</desc>
