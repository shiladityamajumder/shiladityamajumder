<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="188" viewBox="0 0 1000 188" fill="none" role="img" aria-labelledby="title desc">
<title id="title">02 / AUTHENTICATION FOUNDATION</title>
<desc id="desc">Simplified source-informed flow: Credentials (email + password) → Auth service (user verification) → JWT (access + refresh) → Role checks (dependencies) → Endpoints (SQLAlchemy data). LOGIN ISSUES TOKENS / PROTECTED REQUESTS CHECK IDENTITY &amp; ROLE. Represents implemented code paths, not a production or security audit.</desc>
