<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="188" viewBox="0 0 1000 188" fill="none" role="img" aria-labelledby="title desc">
<title id="title">03 / PERMISSIONED DATA FLOW</title>
<desc id="desc">Simplified source-informed flow: Request (bearer token) → SimpleJWT (authentication) → Permissions (access checks) → DRF (view + serializer) → ORM (SQLite default). PROTECTED CRUD FLOW / SERIALIZER VALIDATION ON WRITES. Represents implemented code paths, not a production or security audit.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#60A5FA" stroke-width="1.3" fill="none"/></marker></defs>

<g font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<rect x="0.5" y="0.5" width="999" height="187" rx="14" fill="#080D18" stroke="#25344A" />
<text x="28" y="32" fill="#94A3B8" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" letter-spacing="1.5">03 / PERMISSIONED DATA FLOW</text><path d="M28 49H972" fill="none" stroke="#25344A" stroke-width="1" /><path d="M204 106H218" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M398 106H412" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M592 106H606" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M786 106H800" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="73" width="176" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M38 83H48" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="116.0" y="103.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">Request</text><text x="116.0" y="125.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">bearer token</text><rect x="222" y="73" width="176" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M232 83H242" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="310.0" y="103.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">SimpleJWT</text><text x="310.0" y="125.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">authentication</text><rect x="416" y="73" width="176" height="66" rx="5" fill="#111C2E" stroke="#3B82F6" /><path d="M426 83H436" fill="none" stroke="#60A5FA" stroke-width="1" opacity=".6"/><text x="504.0" y="103.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">Permissions</text><text x="504.0" y="125.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">access checks</text><rect x="610" y="73" width="176" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M620 83H630" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="698.0" y="103.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">DRF</text><text x="698.0" y="125.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">view + serializer</text><rect x="804" y="73" width="176" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M814 83H824" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="892.0" y="103.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">ORM</text><text x="892.0" y="125.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">SQLite default</text><text x="28" y="166" fill="#94A3B8" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" letter-spacing="0.3">PROTECTED CRUD FLOW / SERIALIZER VALIDATION ON WRITES</text>
