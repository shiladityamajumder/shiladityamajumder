<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="524" viewBox="0 0 1000 524" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Engineering technology ecosystem</title>
<desc id="desc">Application: Python, FastAPI, Django, Django REST Framework. Data: PostgreSQL, MySQL, Redis. Messaging: RabbitMQ and Celery. Infrastructure: AWS, Docker, Linux, Nginx. Engineering: SQLAlchemy, Pydantic, Git. Conceptual layers across different projects, not a single production deployment.</desc>


