<svg xmlns="http://www.w3.org/2000/svg" width="480" height="432" viewBox="0 0 480 432" fill="none" role="img" aria-labelledby="title desc">
<title id="title">03 / PERMISSIONED DATA FLOW</title>
<desc id="desc">Simplified source-informed flow: Request (bearer token) → SimpleJWT (authentication) → Permissions (access checks) → DRF (view + serializer) → ORM (SQLite default). PROTECTED CRUD FLOW / SERIALIZER VALIDATION ON WRITES. Represents implemented code paths, not a production or security audit.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" stroke="#60A5FA" stroke-width="1.3" fill="none"/></marker></defs>

<g font-family="Arial, Helvetica, Liberation Sans, sans-serif">
<rect x="0.5" y="0.5" width="479" height="431" rx="14" fill="#080D18" stroke="#25344A" />
<text x="28" y="32" fill="#94A3B8" font-size="12" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" letter-spacing="1.5">03 / PERMISSIONED DATA FLOW</text><path d="M28 49H452" fill="none" stroke="#25344A" stroke-width="1" /><path d="M226 111H250" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M353 144V179" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M254 216H230" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M127 249V284" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="28" y="78" width="198" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M38 88H48" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="127.0" y="108.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">Request</text><text x="127.0" y="130.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">bearer token</text><rect x="254" y="78" width="198" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M264 88H274" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="353.0" y="108.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">SimpleJWT</text><text x="353.0" y="130.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">authentication</text><rect x="254" y="183" width="198" height="66" rx="5" fill="#111C2E" stroke="#3B82F6" /><path d="M264 193H274" fill="none" stroke="#60A5FA" stroke-width="1" opacity=".6"/><text x="353.0" y="213.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">Permissions</text><text x="353.0" y="235.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">access checks</text><rect x="28" y="183" width="198" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M38 193H48" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="127.0" y="213.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">DRF</text><text x="127.0" y="235.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">view + serializer</text><rect x="28" y="288" width="198" height="66" rx="5" fill="#111C2E" stroke="#25344A" /><path d="M38 298H48" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".6"/><text x="127.0" y="318.0" fill="#F8FAFC" font-size="19" font-weight="500" text-anchor="middle">ORM</text><text x="127.0" y="340.0" fill="#94A3B8" font-size="14" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" text-anchor="middle">SQLite default</text><text x="254" y="311" fill="#60A5FA" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">SCHEMATIC</text><text x="254" y="336" fill="#94A3B8" font-size="14" font-weight="400">Source-informed flow</text><text x="28" y="391" fill="#94A3B8" font-size="14" font-weight="400">Protected CRUD flow; serializer</text><text x="28" y="411" fill="#94A3B8" font-size="14" font-weight="400">validation runs on writes.</text>
