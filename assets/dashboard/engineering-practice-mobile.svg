<title id="title">Experience and engineering practice</title>
<desc id="desc">5+ years of experience in Python backend engineering. API architecture: clear contracts and service boundaries. Distributed workflows: messaging, background processing and dependable retries. Database engineering: PostgreSQL, query optimization and consistency under concurrency. Qualitative strengths from the professional biography, not performance measurements.</desc>


